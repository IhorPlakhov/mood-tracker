<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер настрою</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <header>
      <h1>Трекер настрою</h1>
    </header>

    <div class="layout" id="app">
      <div class="layout">
        <main>
          <section>
            <h2>Відмітити настрій</h2>
            <!-- Форма лишається без змін -->
            <form id="mood-form" action="#" method="post">
              <!-- ...поля форми... -->
            </form>
          </section>

          <section>
            <h2>Історія записів</h2>
            <button type="button" id="refresh-button" hidden>Оновити</button>
            <p id="error-message" class="error-state" role="alert" hidden></p>

            <div class="cards" id="mood-history">
              <!-- Спрощений виклик без index -->
              <mood-entry
                v-for="record in moodRecords"
                :key="record.id"
                :date="record.date"
                :mood="record.mood"
                :note="record.note"
              />
            </div>
          </section>
        </main>
        <aside>
          <h2>Статистика та підсумок</h2>
          <p id="avg-mood">Середній настрій: —</p>
        </aside>
      </div>
    </div>

    <footer>
      <p>&copy;Навчальний проєкт «Трекер настрою». Автор: Ігор Плахов.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
