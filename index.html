<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер настрою</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <header>
      <h1>Трекер настрою</h1>
    </header>

    <div class="layout" id="app">
      <div class="layout">
        <main>
          <section>
            <h2>Відмітити настрій</h2>

            <form id="mood-form" action="#" method="post">
              <div class="mood-field">
                <label for="mood-value">Настрій (число від 1 до 6):</label>
                <input
                  type="number"
                  id="mood-value"
                  name="mood"
                  min="1"
                  max="6"
                  step="1"
                  required
                />
                <small class="mood-hint"
                  >1 — дуже сумний, 6 — неймовірний</small
                >
              </div>

              <div>
                <label for="mood-comment">Думки та нотатки протягом дня:</label>
                <textarea
                  id="mood-comment"
                  name="comment"
                  rows="3"
                  maxlength="200"
                  required
                ></textarea>
                <small id="char-counter">Залишилось символів: 200</small>
              </div>
              <button type="submit">Зберегти настрій</button>
            </form>
          </section>

          <section>
            <h2>Історія записів</h2>
            <button type="button" id="refresh-button" hidden>Оновити</button>
            <p id="error-message" class="error-state" role="alert" hidden></p>

            <div class="cards" id="mood-history">
              <mood-entry
                v-for="record in moodRecords"
                :key="record.id"
                :date="record.date"
                :mood="record.mood"
                :note="record.note"
                :email="record.email"
              ></mood-entry>
            </div>
          </section>
        </main>
        <aside>
          <h2>Статистика та підсумок</h2>
          <p id="avg-mood">Середній настрій: —</p>
        </aside>
      </div>
    </div>

    <footer>
      <p>&copy;Навчальний проєкт «Трекер настрою». Автор: Ігор Плахов.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
