<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер настрою</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Трекер настрою</h1>
    </header>

    <div class="layout">
      <main>
        <section>
          <h2>Відмітити настрій</h2>

          <form id="mood-form" action="#" method="post">
            <div class="mood-selector">
              <input type="radio" id="mood-amazing" name="mood" value="6" />
              <label for="mood-amazing" class="mood-box">
                <span class="mood-emoji">🤩</span>
                <span class="mood-title">Неймовірний</span>
              </label>

              <input type="radio" id="mood-happy" name="mood" value="5" />
              <label for="mood-happy" class="mood-box">
                <span class="mood-emoji">😊</span>
                <span class="mood-title">Чудовий</span>
              </label>

              <input
                type="radio"
                id="mood-calm"
                name="mood"
                value="4"
                checked
              />
              <label for="mood-calm" class="mood-box">
                <span class="mood-emoji">🙂</span>
                <span class="mood-title">Спокійний</span>
              </label>

              <input type="radio" id="mood-tired" name="mood" value="3" />
              <label for="mood-tired" class="mood-box">
                <span class="mood-emoji">🥱</span>
                <span class="mood-title">Виснажений</span>
              </label>

              <input type="radio" id="mood-sad" name="mood" value="2" />
              <label for="mood-sad" class="mood-box">
                <span class="mood-emoji">😔</span>
                <span class="mood-title">Сумний</span>
              </label>

              <input type="radio" id="mood-very-sad" name="mood" value="1" />
              <label for="mood-very-sad" class="mood-box">
                <span class="mood-emoji">😭</span>
                <span class="mood-title">Дуже сумний</span>
              </label>
            </div>

            <div>
              <label for="mood-comment">Думки та нотатки протягом дня:</label>
              <textarea
                id="mood-comment"
                name="comment"
                rows="3"
                maxlength="200"
              ></textarea>
              <small>Залишилось символів: 200</small>
            </div>
            <button type="submit">Зберегти настрій</button>
          </form>
        </section>

        <section>
          <h2>Історія записів</h2>

          <div class="cards" id="mood-history"></div>
        </section>
      </main>

      <aside>
        <h2>Статистика та підсумок</h2>
        <p id="avg-mood">Середній настрій: —</p>
      </aside>
    </div>

    <footer>
      <p>&copy;Навчальний проєкт «Трекер настрою». Автор: Ігор Плахов.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
